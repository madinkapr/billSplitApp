services:
  frontend:
    build: ./apps/frontend
    ports:
      - "8890:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./apps/backend
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://tabup:${POSTGRES_PASSWORD}@db:5432/tabup
      - PORT=3001
    volumes:
      - receipt_uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=tabup
      - POSTGRES_USER=tabup
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  receipt_uploads:
